<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hierarhical Table</title>
</head>

<body bgcolor="lightgrey">
    <header align="center">
        <u>
            <h1>Table of the Content -(H1 Tag)</h1> <!--H1 tag-->
        </u>
    </header>
    <Section>
        <div>
            <table border="6px" align="center">
                <tr>
                    <th>
                        <h2> S.no</h2><!--H2 tag-->
                    </th>
                    <th>
                        <h2>Content</h2>
                    </th>
                    <th>
                        <h2> Page no:</h2>
                    </th>
                    <th>
                        <h2> Head Tags(H2-Tag):</h2>
                    </th>
                </tr>
                <tr>
                    <td>
                        <h3>1</h3><!--H3 tag-->
                    </td>
                    <td>
                        <h3>Home</h3>
                    </td>
                    <td>
                        <h3>1</h3>
                    </td>
                    <td>
                        <h3>H3 Tag</h3>
                    </td>

                </tr>
                <tr>
                    <td>
                        <h4>1.1</h4><!--H4 tag-->
                    </td>
                    <td>
                        <h4>Welcome page</h4>
                    </td>
                    <td>
                        <h4>2</h4>
                    </td>
                    <td>
                        <h4>H4 Tag</h4>
                    </td>

                </tr>
                <tr>
                    <td>
                        <h5>1.2</h5><!--H5 tag-->
                    </td>
                    <td>
                        <h5>Nav bar</h5>
                    </td>
                    <td>
                        <h5>3</h5>
                    </td>
                    <td>
                        <h5>H5 Tag</h5>
                    </td>

                </tr>

                <tr>
                    <td>
                        <h6>1.3</h6><!--H6 tag-->
                    </td>
                    <td>
                        <h6>content</h6>
                    </td>
                    <td>
                        <h6>4</h6>
                    </td>
                    <td>
                        <h6>H6 Tag</h6>
                    </td>

                </tr>
            </table>
        </div>
    </Section>

</body>

</html>
