<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body >
    <center>
        <h2><i><u>Registration Form</u></i></h2>
    </center>

    <div>
        <form>
            <label>
                Username:<br>
                <input type="text" placeholder="Enter your Name">
                <br><br>

                Email:<br>
                <input type="email" placeholder="Enter your Email Id">
                <br><br>
                
                Password:<br>
                <input type="password" placeholder="Enter the Password">
                <br><br>

                Confirm Password:<br>
                <input type="password" placeholder="Re-Enter the Password">
                <br><br>

                Date of Birth:<br>
                <input type="date">
                <br><br>

                Gender:<br>
                <input type="radio" value="Male">Male
                <input type="radio" value="Female">Female
                <br><br>

                Country:
                <select>
                    <option value="Country">India</option>
                    <option value="Country">France</option>
                    <option value="Country">America</option>
                    <option value="Country">England</option>
                    <option value="Country">Australia</option>
                    <option value="Country">Bostan</option>
                </select>
                <br><br>

                <input type="checkbox">Terms & Condition.
                <br><br>

                <button>Submit</button>
                
            </label>
        </form>

    </div>

</body>

</html>
